# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot-yml-file
#
# Each ecosystem below declares two groups:
#   * a `security-updates` group, so Dependabot bundles the fixes it opens in
#     response to Dependabot alerts into a single PR instead of one PR per
#     advisory. These are driven by alerts, not by `schedule`, and they ignore
#     `open-pull-requests-limit`.
#   * a `version-updates` group for routine minor/patch bumps. Majors are left
#     out on purpose so they arrive as individual, reviewable PRs.
#
# Deliberately not watched:
#   * The generated SDKs (sdk/nodejs, sdk/python, sdk/dotnet, sdk/java) — their
#     manifests are codegen output that `make build_sdks` rewrites, so
#     dependency PRs against them would not survive regeneration.
#   * examples/ — that tree is the integration-test harness (`cd examples &&
#     go test -tags=all`, run against a live DataRobot account rather than in
#     CI) plus sample programs, none of it shipped to users. Its dependencies
#     are almost entirely transitive pulls from pulumi/pkg and @pulumi/pulumi,
#     so the way to move them is bumping Pulumi, not a per-advisory PR against
#     a lockfile no release consumes.
version: 2
updates:
  # provider/ is the provider itself; sdk/go.mod is the Go SDK that users
  # import. Both ship, so both get watched.
  - package-ecosystem: "gomod"
    directories:
      - "/provider"
      - "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Upgraded by the "Upgrade provider" workflow via
      # pulumi/pulumi-upgrade-provider-action, which also regenerates the SDKs,
      # docs and CHANGELOG and picks the next provider version. A bare go.mod
      # bump from Dependabot skips all of that.
      #
      # There is also a hard blocker. The Go module proxy still serves a
      # v1.0.0 for this module, cached from a tag upstream has since deleted;
      # it resolves to commit 6e8b757 from 2024-10-19. Upstream actually
      # releases v0.10.x, so v1.0.0 is the highest semver Dependabot can see:
      # every bump it proposes (e.g. #356) rolls the provider ~22 months
      # backwards while looking like an upgrade, and it can never offer a real
      # v0.10.x again. The workflow reads GitHub's releases/latest instead, so
      # it is unaffected.
      - dependency-name: "github.com/datarobot-community/terraform-provider-datarobot"
      # Not "never upgrade" — just not Dependabot's job. The version is set by
      # `target-bridge-version` in .github/workflows/upgrade-provider.yml, so
      # the next scheduled run pulls any Dependabot bump back to the pin. The
      # upgrade also needs a module-path move (pulumi/pulumi-java/pkg ->
      # pulumi/pulumi-java) that Dependabot cannot make, or the tfgen build
      # fails. #327 does it properly; that is where bridge upgrades belong.
      - dependency-name: "github.com/pulumi/pulumi-terraform-bridge/v3"
    groups:
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
      gomod-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
