name: Build

on:
  workflow_call:
    inputs: {}
  pull_request:
    branches:
    - main
    - v*
    - feature*
    paths-ignore:
    - CHANGELOG.md

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CGO_ENABLED: 0
  # Language SDK codegen comes from the pulumi-language-* plugins bundled with the CLI,
  # not from the pulumi/pulumi/pkg/v3 pin in provider/go.mod, so an unpinned CLI silently
  # changes generated output. Keep in sync across the workflows that generate SDKs;
  # bumping it regenerates them.
  PULUMI_VERSION: 3.260.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # The versions of golangci-lint and setup-go here cross-depend and need to update together.
        go-version-file: provider/go.mod
        # Either this action or golangci-lint needs to disable the cache
        cache: true

    - name: disarm go:embed directives to enable lint
      continue-on-error: true # this fails if there are no go:embed directives
      run: |
        git grep -l 'go:embed' -- provider | xargs sed -i 's/go:embed/ goembed/g'

    - name: prepare upstream
      continue-on-error: true
      run: make upstream

    - name: Download dependencies
      run: make tidy

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest # Ensures the latest v2 version is used
        working-directory: provider
        skip-cache: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Repo
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Unshallow clone for tags
      run: git fetch --prune --unshallow --tags

    - name: Install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # The versions of golangci-lint and setup-go here cross-depend and need to update together.
        go-version-file: provider/go.mod
        # Either this action or golangci-lint needs to disable the cache
        cache: true

    - name: Install pulumictl
      uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
      with:
        repo: pulumi/pulumictl

    - name: Install Pulumi CLI
      uses: pulumi/action-install-pulumi-cli@b374ceb6168550de27c6eba92e01c1a774040e11 # tag=v2.0.0
      with:
        pulumi-version: ${{ env.PULUMI_VERSION }}

    - name: Download dependencies
      run: make tidy

    - name: Build and regenerate SDKs
      run: make regenerate_sdks

    # The committed SDKs have to match codegen, or the release job's worktree check
    # fails after it has already published the binaries and some of the SDKs. READMEs
    # are stamped with the release version at build time, so they only match on a tag;
    # compare the generated code and the schema instead.
    - name: Check SDKs are up to date
      run: |
        git checkout -- 'sdk/*/README.md'
        paths=(sdk provider/cmd/pulumi-resource-datarobot/schema.json)
        if ! git diff --quiet -- "${paths[@]}"; then
          >&2 echo "error: the committed SDKs do not match what codegen produces."
          >&2 echo "Run 'make regenerate_sdks' with Pulumi CLI ${PULUMI_VERSION} and commit the result."
          git --no-pager diff --stat -- "${paths[@]}"
          git --no-pager diff -- "${paths[@]}"
          exit 1
        fi

    - name: Test
      run: make test
