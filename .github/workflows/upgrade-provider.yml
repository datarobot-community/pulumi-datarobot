name: Upgrade provider
on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Override version (e.g., v0.10.27)'
        required: false
        type: string
  issues:
    types:
    - opened
  schedule:
    - cron: '0 5 * * *'
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  upgrade_provider:
    name: upgrade-provider
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      pr_branch: ${{ steps.detect_pr.outputs.pr_branch }}
      pr_number: ${{ steps.detect_pr.outputs.pr_number }}
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Install mise
      run: |
        curl https://mise.run | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Call upgrade provider action
      uses: pulumi/pulumi-upgrade-provider-action@v0.0.19
      with:
        target-bridge-version: 'v3.137.0'
    - name: Fetch upstream Terraform provider latest release
      id: upstream
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        API_URL="https://api.github.com/repos/datarobot-community/terraform-provider-datarobot/releases/latest"
        echo "Fetching latest upstream Terraform provider release..."
        JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL")
        UPSTREAM_TAG=$(echo "$JSON" | jq -r .tag_name)
        if [[ -z "$UPSTREAM_TAG" || "$UPSTREAM_TAG" == "null" ]]; then
          echo "Failed to fetch upstream tag; falling back to v0.0.0" >&2
          UPSTREAM_TAG="v0.0.0"
        fi
        echo "Upstream Terraform provider latest tag: $UPSTREAM_TAG"
        echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
    - name: Determine next version
      id: version
      run: |
        # Check for manual version override
        if [[ -n "${{ inputs.version_override }}" ]]; then
          NEXT_VERSION="${{ inputs.version_override }}"
          echo "Using manual version override: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Get the current version from the last tag
        CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Current version: $CURRENT_VERSION"

        # Extract version parts (assuming semver: v1.2.3)
        VERSION_NUMBER=${CURRENT_VERSION#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUMBER"

        # Decide next version based on upstream provider
        UPSTREAM="${{ steps.upstream.outputs.upstream_tag }}"
        UPSTREAM_BASE=${UPSTREAM#v}
        IFS='.' read -r U_MAJOR U_MINOR U_PATCH <<< "$UPSTREAM_BASE"
        if [[ $U_MAJOR -gt $MAJOR ]] || [[ $U_MAJOR -eq $MAJOR && $U_MINOR -gt $MINOR ]] || [[ $U_MAJOR -eq $MAJOR && $U_MINOR -eq $MINOR && $U_PATCH -gt $PATCH ]]; then
          NEXT_VERSION="v${U_MAJOR}.${U_MINOR}.${U_PATCH}"
          echo "Adopting upstream provider version $NEXT_VERSION"
        else
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "Upstream not ahead; incrementing patch to $NEXT_VERSION"
        fi

        echo "Next version: $NEXT_VERSION"
        echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
    - name: Detect upgrade provider PR branch
      id: detect_pr
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Detecting upgrade provider PR branch (post action)..."
        PR_BRANCH=""

        # First, try to detect from git state — the action may have left us on the created branch
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
        DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
        if [[ -n "$CURRENT_BRANCH" && "$CURRENT_BRANCH" != "$DEFAULT_BRANCH" && "$CURRENT_BRANCH" != "HEAD" ]]; then
          echo "Detected current branch: $CURRENT_BRANCH (using as PR branch)"
          PR_BRANCH="$CURRENT_BRANCH"
        fi

        # Fall back to searching via GitHub API with retries to handle propagation delay
        if [[ -z "$PR_BRANCH" ]]; then
          for ATTEMPT in 1 2 3 4 5; do
            echo "Attempt $ATTEMPT: searching for upgrade provider PR..."
            PR_JSON=$(gh pr list --state open --author github-actions[bot] --search "Upgrade terraform-provider-datarobot" --json number,headRefName,title,updatedAt --limit 20 | jq -r 'sort_by(.updatedAt) | reverse | .[0]')
            if [[ -n "$PR_JSON" && "$PR_JSON" != "null" ]]; then
              PR_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
              echo "Found PR: $PR_TITLE (branch: $PR_BRANCH)"
              break
            fi
            echo "No PR found yet, waiting 15 s before retry..."
            sleep 15
          done
        fi

        if [[ -z "$PR_BRANCH" ]]; then
          echo "No matching upgrade provider PR found after retries."
          echo "pr_branch=" >> $GITHUB_OUTPUT
          echo "pr_number=" >> $GITHUB_OUTPUT
          exit 0
        fi

        # The changelog comment needs the PR number, which branch detection above may not have found.
        PR_NUMBER=$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[0].number // empty' || echo "")
        echo "PR branch: $PR_BRANCH (number: ${PR_NUMBER:-unknown})"
        echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

  generate_readmes_and_changelog:
    name: generate-readmes-and-changelog
    runs-on: ubuntu-latest
    needs: upgrade_provider
    if: needs.upgrade_provider.outputs.pr_branch != ''
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.upgrade_provider.outputs.pr_branch }}
          fetch-depth: 0
      - name: Prepare repository (fetch tags)
        run: git fetch --prune --tags
      - name: Generate SDK READMEs
        env:
          VERSION: ${{ needs.upgrade_provider.outputs.version }}
        run: |
          if [[ -f "./build-readme.sh" ]]; then
            chmod +x ./build-readme.sh
            VERSION="$VERSION" ./build-readme.sh
          else
            echo "build-readme.sh not found, skipping README generation"
          fi
      - name: Install schema-tools
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        continue-on-error: true
        with:
          repo: pulumi/schema-tools
      - name: Generate changelog entry
        id: changelog
        # Never block the README commit below on a changelog failure (e.g. a GitHub
        # API hiccup); the step is annotated as failed and the upgrade still lands.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.upgrade_provider.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main

          # The upstream version is pinned only in provider/go.mod, so read it from
          # there rather than parsing the bot's PR title.
          upstream_version() {
            git show "$1:provider/go.mod" | awk '/terraform-provider-datarobot v/ { print $2; exit }'
          }
          OLD_UPSTREAM="$(upstream_version origin/main)"
          NEW_UPSTREAM="$(awk '/terraform-provider-datarobot v/ { print $2; exit }' provider/go.mod)"
          echo "Upstream: ${OLD_UPSTREAM:-unknown} -> ${NEW_UPSTREAM:-unknown}"

          if [[ -z "$NEW_UPSTREAM" ]]; then
            echo "Could not read the upstream version from provider/go.mod; skipping changelog."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            ./scripts/upstream-changelog.sh "${OLD_UPSTREAM:-$NEW_UPSTREAM}" "$NEW_UPSTREAM"
            echo
            ./scripts/schema-diff.sh origin/main
          } > /tmp/changelog-notes.md

          ./scripts/changelog.sh insert "$VERSION" /tmp/changelog-notes.md
          echo "generated=true" >> "$GITHUB_OUTPUT"
      - name: Commit README and changelog changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/*/README.md CHANGELOG.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No README or changelog changes; nothing to commit."
          else
            echo "Changes detected; committing..."
            git commit -m "Update SDK READMEs and changelog after provider upgrade"
            git push origin HEAD
          fi
      - name: Post changelog on the PR
        if: steps.changelog.outputs.generated == 'true' && needs.upgrade_provider.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.upgrade_provider.outputs.pr_number }}
        run: |
          # A sticky comment, not an edit to the PR body: the body belongs to the
          # upgrade-provider tool and other bots already append to it.
          {
            echo "## What this upgrade changes"
            echo
            cat /tmp/changelog-notes.md
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
