name: Release-select
on:
  workflow_dispatch:
    inputs:
      PUBLISH_PYPI:
        description: 'Publish to PyPI'
        required: false
        default: 'true'
      PUBLISH_NPM:
        description: 'Publish to NPM'
        required: false
        default: 'true'
      PUBLISH_NUGET:
        description: 'Publish to NuGet'
        required: false
        default: 'true'
      SDK_LANGUAGE:
        description: 'SDK language to release (nodejs, python, dotnet, go)'
        required: true
        default: 'python'
      USE_EXISTING_RELEASE:
        description: 'Use existing GoReleaser artifacts (skip build/release)'
        required: false
        default: 'false'
      RELEASE_REF:
        description: 'Tag to build and publish (e.g. v0.11.2). Leave empty to use the dispatch ref.'
        required: false
        default: ''

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN:  ${{ secrets.NPM_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_REGISTRY_URL: https://registry.npmjs.org
  PUBLISH_NPM: ${{ github.event.inputs.PUBLISH_NPM || 'true' }}
  NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
  NUGET_FEED_URL: https://api.nuget.org/v3/index.json
  PUBLISH_NUGET: ${{ github.event.inputs.PUBLISH_NUGET || 'true' }}
  PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  PYPI_USERNAME: __token__
  PUBLISH_PYPI: ${{ github.event.inputs.PUBLISH_PYPI || 'true' }}
  SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
  SIGNING_KEY_ID: ${{ secrets.JAVA_SIGNING_KEY_ID }}
  SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
  # Language SDK codegen comes from the pulumi-language-* plugins bundled with the CLI,
  # not from the pulumi/pulumi/pkg/v3 pin in provider/go.mod, so an unpinned CLI silently
  # changes generated output. Keep in sync with release.yml, build.yml and
  # upgrade-provider.yml; bumping it regenerates the SDKs.
  PULUMI_VERSION: 3.261.0
  # The commit to build from. Dispatching on `main` with RELEASE_REF=<tag> runs this
  # workflow definition while building the tagged source, so a fix to this file can be
  # used to re-publish an SDK for a tag that was cut before the fix landed.
  RELEASE_REF: ${{ github.event.inputs.RELEASE_REF || github.ref_name }}

jobs:
  release_sdk:
    name: Release Selected SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.RELEASE_REF }}
      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: provider/go.mod
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: pulumi/pulumictl
      # `make build_<lang>` runs `install_plugins`, which shells out to `pulumi`.
      - name: Install Pulumi CLI
        uses: pulumi/action-install-pulumi-cli@b374ceb6168550de27c6eba92e01c1a774040e11 # tag=v2.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Set PreRelease Version
        run: echo "GORELEASER_CURRENT_TAG=v$(pulumictl get version --language generic)" >> $GITHUB_ENV

      - name: Download latest release artifacts
        if: ${{ github.event.inputs.USE_EXISTING_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern "pulumi-resource-datarobot-*" --dir ./release-assets

      - name: Setup Python
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'python' && env.PUBLISH_PYPI == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build SDK
        run: make build_${{ github.event.inputs.SDK_LANGUAGE }}

      # Reported, not enforced. This is the recovery path: it runs after a release has
      # already published its binaries and some of its SDKs, so failing here would leave
      # that release permanently half-published. The package is built from the tree this
      # step inspects, so a diff means the committed SDK is stale and should be
      # regenerated on main -- it does not mean the published artifact is wrong.
      - name: Check worktree clean
        continue-on-error: true
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet; then
              >&2 echo "warning: generated SDK differs from the committed tree; publishing the generated output."
              >&2 echo "Regenerate and commit the SDK on main to clear this."
              git status
              git diff
          fi

      - name: Build release notes from CHANGELOG.md
        id: notes
        if: ${{ github.event.inputs.USE_EXISTING_RELEASE != 'true' }}
        env:
          TAG: ${{ env.RELEASE_REF }}
        run: |
          if ./scripts/changelog.sh extract "$TAG" > /tmp/release-notes.md; then
            echo "args=release --clean --release-notes=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Release with GoReleaser
        if: ${{ github.event.inputs.USE_EXISTING_RELEASE != 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          args: ${{ steps.notes.outputs.args }}
          version: latest

      - name: Publish Python SDK
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'python' && env.PUBLISH_PYPI == 'true' }}
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: ${{ env.PYPI_USERNAME }}
          password: ${{ env.PYPI_PASSWORD }}
          packages-dir: ${{github.workspace}}/sdk/python/bin/dist

      - name: Setup Node.js for NPM publish
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1 or later
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        run: npm install -g npm@latest

      - name: Publish JS SDK
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        working-directory: ${{github.workspace}}/sdk/nodejs/bin
        run: npm publish --access public --tag latest

      - name: Publish .NET SDK
        if: ${{ github.event.inputs.SDK_LANGUAGE == 'dotnet' && env.PUBLISH_NUGET == 'true' }}
        run: |
          dotnet nuget push ${{github.workspace}}/sdk/dotnet/bin/Debug/*.nupkg -s ${{ env.NUGET_FEED_URL }} -k ${{ env.NUGET_PUBLISH_KEY }}
          echo "done publishing packages"
